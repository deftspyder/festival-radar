<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="robots" content="noindex">
<title>Tower Control Research</title>
<meta name="description" content="Rate Tower Control's mixes from your phone.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Tower Control Research on Festival Radar: the same Research as the PC (helper/ui/tower.html), made for a phone.
   Data comes from Supabase (tc_* tables, synced from the PC by tower/fr_sync.py). Ratings go into tc_ratings and
   the PC applies them; only an admin's ratings change the scores, Review and Arrange. */
:root {
  --bg: #0c0c0d; --panel: #161718; --panel2: #121314; --raised: #1c1d20; --raised2: #222427;
  --line: #2c2e31; --line2: #34373b; --ink: #e9eaec; --muted: #a3a6ab; --faint: #6f737a; --off: #2a2c30;
  --plan: #3fe0c5; --plan-bg: #10302b; --plan-ink: #8ff0df;
  --warn: #ffb547; --warn-bg: #2b2112; --bad: #ff6b5e; --bad-bg: #2e1513;
  --sec-peak: #ffa62a; --sec-groove: #35a095; --sec-bassout: #899198; --sec-breakdown: #8a4554; --sec-fade: #596168; --sec-other: #3f8290;
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) }
body.playing { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 84px) }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--plan); outline-offset: 2px }
button:disabled { opacity: .45; cursor: not-allowed }
a { color: var(--plan-ink) }
[hidden] { display: none !important }
.muted { color: var(--muted) } .small { font-size: 13px } .mono { font-family: var(--mono) }
.lab { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.h { font: 700 19px var(--display); letter-spacing: .07em; text-transform: uppercase; margin: 0 }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(12,12,13,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; display: grid; gap: 6px }
.top .row { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand { font: 700 20px var(--display); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap }
.brand b { color: var(--plan) }
.top .grow { flex: 1; min-width: 0 }
.syncl { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.syncl i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--plan); margin-right: 6px; vertical-align: 0 }
.syncl.old i { background: var(--warn) }
.iconbtn { min-width: 44px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; padding: 0 10px; white-space: nowrap }
.back { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; flex: none }
@media (max-width: 420px) { .brand { font-size: 18px; letter-spacing: .07em } .top .lab { font-size: 12px } }

.wrap { padding: 12px 16px; display: grid; gap: 12px; max-width: 1280px; margin: 0 auto }
.controls { display: grid; gap: 8px }
select, input[type=search], input[type=text], textarea { background: #0f1011; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px; min-height: 44px; width: 100%; font-size: 16px }
textarea { min-height: 70px; resize: vertical }
.seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.seg::-webkit-scrollbar { display: none }
.seg button { flex: none; background: #0f1011; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 40px; color: var(--muted); font-weight: 600; white-space: nowrap }
.seg button[aria-pressed="true"] { background: #2a2c30; color: #fff; border-color: var(--line2) }

/* pairings */
.cols { display: grid; gap: 12px }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start } .pairs { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow-y: auto } }
.pairs { display: grid; gap: 6px; align-content: start }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); min-height: 56px }
.pair[aria-pressed="true"] { border-color: var(--plan); background: #142320 }
.pair b { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis }
.pair .bd { align-self: start; font: 700 11px/20px var(--display); letter-spacing: .08em; padding: 0 8px; border-radius: 999px; color: #0c0c0d; white-space: nowrap }
.pair .sub { font-size: 12.5px; color: var(--ink) }
.pair .pcode { font: 500 11.5px var(--mono); color: var(--faint); justify-self: end; align-self: end }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 10px }
.more { justify-self: center; margin-top: 4px }
@media (max-width: 899px) { .cols.open .pairs, .cols.open .controls-pairs { display: none } .cols:not(.open) .detail { display: none } }

/* one pairing */
.detail { display: grid; gap: 10px; min-width: 0 }
.dhead { display: grid; gap: 2px }
.dhead .bk { justify-self: start; min-height: 40px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; margin-bottom: 6px }
@media (min-width: 900px) { .dhead .bk { display: none } }
.dtitle { font: 700 22px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase }
.opts { display: grid; gap: 8px }
.opt { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel) }
.opt.sel { border-color: #3a6f67; background: #121c1b }
.opt.vari { border-left: 3px solid #6fd3ff }
.opt.dropped { opacity: .6 }
.opt .r1 { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center }
.rk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised2); font: 700 14px var(--display) }
.rk.v { background: #12303a; color: #8fe3ff; font-size: 12px }
.opt .nm { font-weight: 600; font-size: 14px; line-height: 1.25 }
.opt .why { font-size: 12.5px; color: var(--muted) }
.vtag { display: inline-block; padding: 0 7px; margin-right: 6px; border-radius: 999px; background: #12303a; color: #8fe3ff; font: 700 11px/18px var(--display); letter-spacing: .07em; vertical-align: 1px }
.foot { display: flex; align-items: center; gap: 8px; justify-content: space-between }
.out { padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--raised2); color: var(--muted) }
.ocode { font: 500 11.5px var(--mono); color: var(--faint); white-space: nowrap }
.others { display: flex; flex-wrap: wrap; gap: 4px }
.others span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--raised2); border: 1px solid var(--line2) }
.others span b { color: var(--rc) }
.pv { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; white-space: nowrap; justify-content: center }
.pv.playing { border-color: var(--plan); color: var(--plan) }
.pv.ask { font-size: 13px; color: var(--muted); padding: 0 12px }
.rate { display: flex; gap: 4px }
.rate button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 52px; padding: 3px 1px; border-radius: 7px; border: 1px solid var(--line2); background: var(--raised); font: 700 11px var(--display); letter-spacing: .03em; color: var(--rc) }
.rate button span { font: 600 10px var(--mono); color: var(--faint) }
.rate button[aria-pressed="true"] { border: 2px solid var(--rc); background: #26282c }
.rate button.pend { border-style: dashed }
.rate.off { opacity: .35; pointer-events: none }
.pendnote { font-size: 12px; color: #8fe3ff }
.crashbtn { justify-self: start; background: none; border: 0; padding: 4px 0; color: #ffb0a8; font-size: 12.5px; text-decoration: underline }
.crash { display: grid; gap: 4px; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: #1d1414; border: 1px solid #3c2422 }

/* lanes */
.lanes { display: grid; gap: 6px; position: relative }
.lane { display: grid; gap: 3px }
.lane .lc { display: flex; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0 }
.lane .lc b { font: 700 12.5px var(--display); letter-spacing: .08em; white-space: nowrap }
.lane .lc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lane canvas { width: 100%; display: block; border-radius: 6px }
.beats { position: relative; height: 22px; border-radius: 6px; background: #121314 }
.beats i { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; font: 600 9.5px/18px var(--mono); color: #0c0c0d; text-align: center; font-style: normal; overflow: hidden }
.verdict { font-size: 12.5px }
.phead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; display: none; box-shadow: 0 0 6px rgba(255,255,255,.6) }

/* cards: compare, suggest */
.card { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid #2c4a52; background: #0f1a1d }
.cmpgrid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr }
@media (max-width: 420px) { .cmpgrid { grid-template-columns: 1fr } }
.cmpside { display: grid; gap: 6px; padding: 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); align-content: start }
.cmpwin { display: grid; gap: 6px; grid-template-columns: 1fr 1fr 1fr }
.btn { background: var(--raised2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; min-height: 44px; font-weight: 600 }
.btn.primary { background: var(--plan-bg); border-color: #2a6f63; color: var(--plan-ink) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.schip { min-height: 38px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised); font-size: 13px; font-weight: 600 }
.schip[aria-pressed="true"] { border: 2px solid #6fd3ff; background: #12303a; color: #bfefff }

/* sheet (rating popup, people) */
.back-drop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; grid-template-columns: minmax(0, 1fr); align-items: end; justify-items: center }
.sheet { width: min(720px, 100%); min-width: 0; overflow-x: hidden; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px 16px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px }
@media (min-width: 760px) { .back-drop { align-items: center } .sheet { border-radius: 14px } }
.sheet .pairnm { font-size: 13px; color: var(--muted) }
.fbg { display: grid; gap: 6px }
.fbgrid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) }
.fbc { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 1px 9px; text-align: left; min-height: 56px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised) }
.fbc .bx { grid-row: span 3; width: 16px; height: 16px; margin-top: 2px; border-radius: 4px; border: 2px solid #5a5e64 }
.fbc.on { border: 2px solid var(--plan); background: #1e2a28 } .fbc.on .bx { background: var(--plan); border-color: var(--plan) }
.fbc b { font-size: 13.5px } .fbc .mn { font-size: 12px; color: #c9ccd1 } .fbc .tc { font-size: 11.5px; color: var(--plan-ink) }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.rpill { padding: 4px 10px; border-radius: 999px; background: var(--raised2); font-weight: 700; font-family: var(--display); letter-spacing: .05em }
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.switch { min-width: 88px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600 }
.switch[aria-pressed="true"] { background: var(--plan-bg); border-color: #2a6f63; color: var(--plan-ink) }

/* player */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #111213; border-top: 1px solid var(--line2);
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center }
.player .pn { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.player .pt { font: 500 12px var(--mono); color: var(--muted) }
.player .prog { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--off); overflow: hidden }
.player .prog i { display: block; height: 100%; width: 0; background: var(--plan) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 45; max-width: min(560px, calc(100% - 32px));
  background: #232528; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5) }
.gate { max-width: 520px; margin: 12vh auto 0; padding: 22px; display: grid; gap: 12px; text-align: center; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel) }
.loading { padding: 40px 16px; text-align: center; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <span class="brand">Tower <b>Control</b></span>
    <span class="lab" style="color:var(--plan-ink)">Research</span>
    <span class="grow"></span>
    <button type="button" class="iconbtn" id="peopleBtn" hidden>People</button>
  </div>
  <div class="row"><div class="syncl grow" id="syncLine" aria-live="polite"></div><a class="back" href="./">← Festival Radar</a></div>
</header>

<main class="wrap" id="main"><div class="loading">Loading Tower Control…</div></main>

<div class="player" id="player" hidden>
  <span class="pn" id="pName"></span>
  <button type="button" class="pv" id="pStop" aria-label="Stop the preview"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>Stop</button>
  <span class="pt" id="pTime"></span>
  <div class="prog"><i id="pBar"></i></div>
</div>
<audio id="audio" preload="none" controlslist="nodownload"></audio>
<div class="toast" id="toast" hidden role="status"></div>
<div id="sheetRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";
const SB_URL = "https://jgxxrmvhjnwpzlxmmgvs.supabase.co";
const SB_KEY = "sb_publishable_ssrd2j825Mi3CJVEMxBvwA_eq4OHvkY";   // the same public key as index.html
const BUCKET = "tc-previews";
const sb = window.supabase && window.supabase.createClient
  ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }) : null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function toast(t, ms = 6000) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms); }

const RATE = [
  { n: 1, l: "Crash", c: "#ff6b5e", r: 40, m: "doesn't work at all" },
  { n: 2, l: "Go-around", c: "#ffb547", r: -20, m: "abort, try another approach" },
  { n: 3, l: "Bumpy", c: "#f0c72e", r: 7, m: "got down, not pretty" },
  { n: 4, l: "Smooth", c: "#3fe0c5", r: 0, m: "a good mix, worth refining" },
  { n: 5, l: "G6", c: "#e9eaec", r: 0, m: "perfect: goes to Arrange" },
];
const plane = (rot, col, w = 24) => `<svg aria-hidden="true" width="${w}" height="${Math.round(w * .58)}" viewBox="0 0 34 20" style="transform:rotate(${rot}deg)"><path d="M2 10 L13 9 L19 2 L22 2 L18 9 L28 9 Q33 10 28 11 L18 11 L22 18 L19 18 L13 11 L2 10 Z M3 10 L6 6 L8 6 L7 10 L8 14 L6 14 Z" fill="${col}"/></svg>`;
const SEC_VAR = { Peak: "--sec-peak", Groove: "--sec-groove", "Bass out": "--sec-bassout", Breakdown: "--sec-breakdown", Fade: "--sec-fade" };
const SKIN = { low: "#ff2a9d", mid: "#9b5cff", high: "#29f0ff", bg: "#160b26" };

let ME = null, ADMIN = false, NAMES = {}, META = { sync: null, feedback: null };
let SONGS = {}, PLS = [], OPTS = {}, RAT = [], LAST_OPT = null;
const ui = { pl: lsGet("tcr-pl"), f: lsGet("tcr-f") || "rate", pair: null, opt: null, shown: 60, showDropped: false, playing: null, cmpDone: new Set(), sg: new Set(), sgFor: null, asked: new Set() };

/* ---------- data ---------- */
async function all(q, page = 1000) {
  let out = [], i = 0;
  for (;;) {
    const { data, error } = await q().range(i, i + page - 1);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < page) return out;
    i += page;
  }
}
async function loadMeta() {
  const { data } = await sb.from("tc_meta").select("key,value,updated_at");
  for (const r of data || []) META[r.key] = r.value;
}
async function loadAll() {
  await loadMeta();
  const [songs, pls, opts] = await Promise.all([
    all(() => sb.from("tc_songs").select("*")),
    all(() => sb.from("tc_playlists").select("*").order("sort")),
    all(() => sb.from("tc_options").select("*").order("id")),
  ]);
  SONGS = {}; songs.forEach(s => SONGS[s.id] = s);
  PLS = pls;
  OPTS = {}; opts.forEach(o => OPTS[o.id] = o);
  LAST_OPT = opts.reduce((m, o) => o.updated_at > m ? o.updated_at : m, "");
  await loadRatings();
}
async function loadRatings() {
  RAT = await all(() => sb.from("tc_ratings").select("id,option_id,user_id,kind,rating,winner,symptoms,good,suggest,note,created_at,synced_at,result").order("id"));
}
async function refresh() {
  if (document.hidden) return;
  try {
    await loadMeta();
    if (LAST_OPT) {
      const ch = await all(() => sb.from("tc_options").select("*").gt("updated_at", LAST_OPT).order("updated_at"));
      ch.forEach(o => { OPTS[o.id] = o; if (o.updated_at > LAST_OPT) LAST_OPT = o.updated_at; });
    }
    if (!refresh.n || ++refresh.n % 6 === 0) {        // every few minutes: drop the ones the PC removed
      const ids = new Set((await all(() => sb.from("tc_options").select("id"))).map(x => x.id));
      for (const k of Object.keys(OPTS)) if (!ids.has(k)) delete OPTS[k];
      refresh.n = refresh.n || 1;
    }
    await loadRatings();
    const a = document.activeElement;
    if (a && a.closest && a.closest("#detail") && /^(INPUT|TEXTAREA)$/.test(a.tagName)) { renderSync(); return; }   // don't redraw under your typing
    render();
  } catch (e) { /* offline for a moment: try again next time */ }
}

/* ---------- ratings: yours, pending ones, other people's ---------- */
const mine = () => RAT.filter(r => r.user_id === ME.id);
function myLatest(id, kinds = ["rate", "clear"]) {
  let best = null; for (const r of RAT) if (r.user_id === ME.id && r.option_id === id && kinds.includes(r.kind)) best = r; return best;
}
// the rating that counts for what you see: an admin's own unsynced rating wins until the PC has applied it
function rating(id) {
  const o = OPTS[id]; if (!o) return null;
  if (ADMIN) { const p = myLatest(id); if (p && !p.synced_at) return p.kind === "clear" ? null : p.rating; return o.rating; }
  const m = myLatest(id); return m && m.kind === "rate" ? m.rating : null;
}
const pending = id => { const p = myLatest(id); return !!(p && !p.synced_at); };
const billRating = id => OPTS[id] ? OPTS[id].rating : null;
function othersFor(id) {
  const by = {};
  for (const r of RAT) if (r.option_id === id && r.kind === "rate" && r.user_id !== ME.id && r.rating) by[r.user_id] = r;
  return Object.values(by);
}

/* ---------- pairings (the PC's Research list) ---------- */
const song = id => SONGS[id] || { title: "?", sections: [], bpm: 120 };
const shortT = t => (t.title || "").replace(/ - Purple Disco Machine.*$/i, "").replace(/ \(feat\..*?\)/i, "").replace(/ \(.*?\)$/, "");
const sec = (tid, i) => (song(tid).sections || []).find(s => s.i === i);
const fam = o => o.data.fam || o.id;

    return `<i style="left:calc(${left.toFixed(2)}% + 1px);width:calc(${wd.toFixed(2)}% - 2px);background:${a <= 8 ? "#3fe0c5" : a <= 20 ? "#ffb547" : "#ff6b5e"}" title="Bar ${i + 1}: B ${a.toFixed(1)} ms ${x < 0 ? "early" : "late"}">${Math.round(a)}</i>`; }).join("");
  const good = qc && qc.beats_max_ms <= 15;
  $("lnVerdict").innerHTML = !qc ? `<span class="muted">No beat check for this preview.</span>`
    : `<b style="color:${good ? "#3fe0c5" : "#ff6b5e"}">${good ? "Beats line up." : "Beats flam."}</b> <span class="muted">Orange ticks are A's bars, blue are B's; in the mix they should sit on top of each other. Median ${(+qc.beats_median_ms).toFixed(1)} ms, worst ${(+qc.beats_max_ms).toFixed(1)} ms.</span>`;
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => drawLanes(true), 150); });

/* ---------- people (admin): who can open Research ---------- */
async function people() {
  const { data, error } = await sb.rpc("tc_members");
  if (error) return toast("Couldn't load the members");
  const list = data || [];
  sheet(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h" id="shTitle">Who can open Research</h2><button type="button" class="btn" data-close>Close</button></div>
    <div class="small muted">People you turn on here can listen and rate on this page. Their ratings show next to yours by name; only yours change your scores, Review and Arrange.</div>
    <div>${list.map(m => `<div class="person"><span>${esc(m.name)}${m.admin ? ' <span class="small muted">· admin</span>' : ""}</span>${m.admin ? `<span class="small muted">Always</span>` : `<button type="button" class="switch" aria-pressed="${!!m.access}" data-uid="${esc(m.id)}">${m.access ? "On" : "Off"}</button>`}</div>`).join("") || `<div class="empty">No members yet.</div>`}</div>`);
  $("sheetRoot").querySelectorAll("[data-uid]").forEach(b => b.onclick = async () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.disabled = true;
    const { error } = await sb.rpc("tc_set_access", { p_user: b.dataset.uid, p_on: on });
    b.disabled = false;
    if (error) return toast("Couldn't change it: " + error.message);
    b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "On" : "Off";
    NAMES = (await sb.rpc("tc_names")).data || NAMES;
  });
}
$("peopleBtn").onclick = () => { ui.sheetReturn = $("peopleBtn"); people(); };

/* ---------- start ---------- */
function gate(html) { $("main").innerHTML = `<div class="gate">${html}</div>`; $("syncLine").textContent = ""; }
async function boot() {
  if (!sb) return gate(`<div class="h">Couldn't load</div><p class="muted">The sign-in library didn't load. Check your connection and reload.</p>`);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return gate(`<div class="h">Sign in first</div><p class="muted">Tower Control Research uses your Festival Radar account.</p><a class="btn primary" style="display:inline-grid;place-items:center;text-decoration:none" href="./">Sign in on Festival Radar</a><p class="small muted">Then come back to this page.</p>`);
  ME = session.user;
  const { data: ok, error } = await sb.rpc("tc_allowed");
  if (error || ok !== true) return gate(`<div class="h">Not on the list yet</div><p class="muted">Tower Control Research is invite only. Ask Bill to turn you on under People.</p><a href="./">Back to Festival Radar</a>`);
  ADMIN = (await sb.rpc("is_admin")).data === true;
  $("peopleBtn").hidden = !ADMIN;
  try { NAMES = (await sb.rpc("tc_names")).data || {}; } catch (e) {}
  try { await loadAll(); }
  catch (e) { return gate(`<div class="h">Couldn't load</div><p class="muted">${esc(e.message || e)}</p><button type="button" class="btn" onclick="location.reload()">Try again</button>`); }
  if (ui.pl == null) ui.pl = ADMIN && META.sync && META.sync.research_playlist ? String(META.sync.research_playlist) : "all";
  const h = location.hash.slice(1).toUpperCase();
  render();
  if (h && pairsCache.some(p => p.key === h)) { ui.pair = h; render(); }
  for (const r of mine()) if (!r.synced_at && Date.now() - new Date(r.created_at).getTime() < 3600e3) watch(r.id);
  setInterval(refresh, 30000);
  setInterval(renderSync, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
boot();
})();
</script>
