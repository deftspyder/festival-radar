<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="robots" content="noindex">
<title>Tower Control Research</title>
<meta name="description" content="Rate Tower Control's mixes from your phone.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Tower Control Research on Festival Radar: the same Research as the PC (helper/ui/tower.html), made for a phone.
   Data comes from Supabase (tc_* tables, synced from the PC by tower/fr_sync.py). Ratings go into tc_ratings and
   the PC applies them; only an admin's ratings change the scores, Review and Arrange. */
:root {
  --bg: #0c0c0d; --panel: #161718; --panel2: #121314; --raised: #1c1d20; --raised2: #222427;
  --line: #2c2e31; --line2: #34373b; --ink: #e9eaec; --muted: #a3a6ab; --faint: #6f737a; --off: #2a2c30;
  --plan: #3fe0c5; --plan-bg: #10302b; --plan-ink: #8ff0df;
  --warn: #ffb547; --warn-bg: #2b2112; --bad: #ff6b5e; --bad-bg: #2e1513;
  --sec-peak: #ffa62a; --sec-groove: #35a095; --sec-bassout: #899198; --sec-breakdown: #8a4554; --sec-fade: #596168; --sec-other: #3f8290;
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) }
body.playing { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 84px) }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--plan); outline-offset: 2px }
button:disabled { opacity: .45; cursor: not-allowed }
a { color: var(--plan-ink) }
[hidden] { display: none !important }
.muted { color: var(--muted) } .small { font-size: 13px } .mono { font-family: var(--mono) }
.lab { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.h { font: 700 19px var(--display); letter-spacing: .07em; text-transform: uppercase; margin: 0 }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(12,12,13,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; display: grid; gap: 6px }
.top .row { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand { font: 700 20px var(--display); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap }
.brand b { color: var(--plan) }
.top .grow { flex: 1; min-width: 0 }
.syncl { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.syncl i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--plan); margin-right: 6px; vertical-align: 0 }
.syncl.old i { background: var(--warn) }
.iconbtn { min-width: 44px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; padding: 0 10px; white-space: nowrap }
.back { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; flex: none }
@media (max-width: 420px) { .brand { font-size: 18px; letter-spacing: .07em } .top .lab { font-size: 12px } .top .row > .lab { display: none } #oneBtn { font-size: 13px; padding: 0 8px } #peopleBtn { display: none } }

.wrap { padding: 12px 16px; display: grid; gap: 12px; max-width: 1280px; margin: 0 auto }
.controls { display: grid; gap: 8px }
select, input[type=search], input[type=text], textarea { background: #0f1011; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px; min-height: 44px; width: 100%; font-size: 16px }
textarea { min-height: 70px; resize: vertical }
.seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.seg::-webkit-scrollbar { display: none }
.seg button { flex: none; background: #0f1011; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 40px; color: var(--muted); font-weight: 600; white-space: nowrap }
.seg button[aria-pressed="true"] { background: #2a2c30; color: #fff; border-color: var(--line2) }

/* pairings */
.cols { display: grid; gap: 12px }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start } .pairs { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow-y: auto } }
.pairs { display: grid; gap: 6px; align-content: start }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); min-height: 56px }
.pair[aria-pressed="true"] { border-color: var(--plan); background: #142320 }
.pair b { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis }
.pair .bd { align-self: start; font: 700 11px/20px var(--display); letter-spacing: .08em; padding: 0 8px; border-radius: 999px; color: #0c0c0d; white-space: nowrap }
.pair .sub { font-size: 12.5px; color: var(--ink) }
.pair .pcode { font: 500 11.5px var(--mono); color: var(--faint); justify-self: end; align-self: end }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 10px }
.more { justify-self: center; margin-top: 4px }
@media (max-width: 899px) { .cols.open .pairs, .cols.open .controls-pairs { display: none } .cols:not(.open) .detail { display: none } }

/* one pairing */
.detail { display: grid; gap: 10px; min-width: 0 }
.dhead { display: grid; gap: 2px }
.dhead .bk { justify-self: start; min-height: 40px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; margin-bottom: 6px }
@media (min-width: 900px) { .dhead .bk { display: none } }
.dtitle { font: 700 22px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase }
.opts { display: grid; gap: 8px }
.opt { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel) }
.opt.sel { border-color: #3a6f67; background: #121c1b }
.opt.vari { border-left: 3px solid #6fd3ff }
.opt.dropped { opacity: .6 }
.opt .r1 { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center }
.rk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised2); font: 700 14px var(--display) }
.rk.v { background: #12303a; color: #8fe3ff; font-size: 12px }
.opt .nm { font-weight: 600; font-size: 14px; line-height: 1.25 }
.opt .why { font-size: 12.5px; color: var(--muted) }
.vtag { display: inline-block; padding: 0 7px; margin-right: 6px; border-radius: 999px; background: #12303a; color: #8fe3ff; font: 700 11px/18px var(--display); letter-spacing: .07em; vertical-align: 1px }
.foot { display: flex; align-items: center; gap: 8px; justify-content: space-between }
.out { padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--raised2); color: var(--muted) }
.ocode { font: 500 11.5px var(--mono); color: var(--faint); white-space: nowrap }
.others { display: flex; flex-wrap: wrap; gap: 4px }
.others span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--raised2); border: 1px solid var(--line2) }
.others span b { color: var(--rc) }
.pv { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600; white-space: nowrap; justify-content: center }
.pv.playing { border-color: var(--plan); color: var(--plan) }
.pv.ask { font-size: 13px; color: var(--muted); padding: 0 12px }
.rate { display: flex; gap: 4px }
.rate button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 52px; padding: 3px 1px; border-radius: 7px; border: 1px solid var(--line2); background: var(--raised); font: 700 11px var(--display); letter-spacing: .03em; color: var(--rc) }
.rate button span { font: 600 10px var(--mono); color: var(--faint) }
.rate button[aria-pressed="true"] { border: 2px solid var(--rc); background: #26282c }
.rate button.pend { border-style: dashed }
.rate.off { opacity: .35; pointer-events: none }
.pendnote { font-size: 12px; color: #8fe3ff }
.crashbtn { justify-self: start; background: none; border: 0; padding: 4px 0; color: #ffb0a8; font-size: 12.5px; text-decoration: underline }
.crash { display: grid; gap: 4px; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: #1d1414; border: 1px solid #3c2422 }

/* lanes */
.lanes { display: grid; gap: 6px; position: relative }
.lane { display: grid; gap: 3px }
.lane .lc { display: flex; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0 }
.lane .lc b { font: 700 12.5px var(--display); letter-spacing: .08em; white-space: nowrap }
.lane .lc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lane canvas { width: 100%; display: block; border-radius: 6px }
.beats { position: relative; height: 22px; border-radius: 6px; background: #121314 }
.beats i { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; font: 600 9.5px/18px var(--mono); color: #0c0c0d; text-align: center; font-style: normal; overflow: hidden }
.verdict { font-size: 12.5px }
.phead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; display: none; box-shadow: 0 0 6px rgba(255,255,255,.6) }

/* cards: compare, suggest */
.card { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid #2c4a52; background: #0f1a1d }
.cmpgrid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr }
@media (max-width: 420px) { .cmpgrid { grid-template-columns: 1fr } }
.cmpside { display: grid; gap: 6px; padding: 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); align-content: start }
.cmpwin { display: grid; gap: 6px; grid-template-columns: 1fr 1fr 1fr }
.btn { background: var(--raised2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; min-height: 44px; font-weight: 600 }
.btn.primary { background: var(--plan-bg); border-color: #2a6f63; color: var(--plan-ink) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.schip { min-height: 38px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised); font-size: 13px; font-weight: 600 }
.schip[aria-pressed="true"] { border: 2px solid #6fd3ff; background: #12303a; color: #bfefff }

/* sheet (rating popup, people) */
.back-drop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; grid-template-columns: minmax(0, 1fr); align-items: end; justify-items: center }
.sheet { width: min(720px, 100%); min-width: 0; overflow-x: hidden; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px 16px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px }
@media (min-width: 760px) { .back-drop { align-items: center } .sheet { border-radius: 14px } }
.sheet .pairnm { font-size: 13px; color: var(--muted) }
.fbg { display: grid; gap: 6px }
.fbgrid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) }
.fbc { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 1px 9px; text-align: left; min-height: 56px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised) }
.fbc .bx { grid-row: span 3; width: 16px; height: 16px; margin-top: 2px; border-radius: 4px; border: 2px solid #5a5e64 }
.fbc.on { border: 2px solid var(--plan); background: #1e2a28 } .fbc.on .bx { background: var(--plan); border-color: var(--plan) }
.fbc b { font-size: 13.5px } .fbc .mn { font-size: 12px; color: #c9ccd1 } .fbc .tc { font-size: 11.5px; color: var(--plan-ink) }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.rpill { padding: 4px 10px; border-radius: 999px; background: var(--raised2); font-weight: 700; font-family: var(--display); letter-spacing: .05em }
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.switch { min-width: 88px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised2); font-weight: 600 }
.switch[aria-pressed="true"] { background: var(--plan-bg); border-color: #2a6f63; color: var(--plan-ink) }

/* player */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #111213; border-top: 1px solid var(--line2);
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center }
.player .pn { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.player .pt { font: 500 12px var(--mono); color: var(--muted) }
.player .prog { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--off); overflow: hidden }
.player .prog i { display: block; height: 100%; width: 0; background: var(--plan) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 45; max-width: min(560px, calc(100% - 32px));
  background: #232528; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5) }
.gate { max-width: 520px; margin: 12vh auto 0; padding: 22px; display: grid; gap: 12px; text-align: center; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel) }
.loading { padding: 40px 16px; text-align: center; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }

/* one pair at a time (v2 phone Research): everything fits on one screen, no scrolling */
body.one { background: #0E0F13; padding-bottom: 0 }
body.one .top, body.one .player { display: none !important }
body.one .wrap { display: block; padding: 0; max-width: none }
body.one .toast { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: auto }
.o { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); color: #E8E8EC; overflow: hidden; width: 100%; min-width: 0 }
.o-top { display: flex; gap: 8px; flex: none }
.o-pick { flex: 1; min-width: 0; height: 44px; border: none; border-radius: 8px; background: #3A3B46; color: #F4F4F8; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500 }
.o-pick.done { background: #10302b; color: #8ff0df }
.o-pick .nm { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-pick .ct { flex: none; min-width: 84px; text-align: right; font: 700 15px var(--mono); color: #fff }
.o-pick.done .ct { color: #8ff0df }
.o-gear { flex: none; width: 44px; height: 44px; border-radius: 8px; border: none; background: #3A3B46; color: #F4F4F8; display: grid; place-items: center }
.o-wave { position: relative; flex: 1 1 auto; min-height: 100px; max-height: 200px }
.o-wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation }
.o-tag { position: absolute; font-size: 12px; background: rgba(14,15,19,.78); padding: 2px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-time { right: 4px; top: 22px; min-width: 44px; text-align: center; font-family: var(--mono) }
.o-names { position: absolute; left: 4px; right: 4px; bottom: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; pointer-events: none }
.o-names .o-tag { position: static; max-width: 64% }
.o-names b { font-weight: 600; color: #B8B8C2; margin-right: 4px }
.o-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 16px; color: #B8B8C2; font-size: 14px; border: 1px dashed #2E2F38; border-radius: 10px }
.o-empty b { color: #F4F4F8; font-size: 16px }
.o-row { display: grid; gap: 6px; flex: none }
.o-way { position: relative; height: 52px; min-width: 0; border-radius: 10px; border: 1.5px solid transparent; background: #24252D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px }
.o-way .wn { font-size: 12.5px; letter-spacing: -.01em; font-weight: 600; color: #F4F4F8; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-way .wh { font-size: 11px; color: #B8B8C2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-way[aria-pressed="true"] { background: #F4F4F8; border-color: #F4F4F8 } .o-way[aria-pressed="true"] .wn { color: #0E0F13 } .o-way[aria-pressed="true"] .wh { color: #3A3B46 }
.o-way.mapped { gap: 4px; padding: 0 7px }
.o-way .map { position: relative; display: block; width: 100%; height: 26px }
.o-way .trk { position: absolute; left: 0; right: 0; top: 0; height: 9px; display: flex; gap: 1px; border-radius: 2px; overflow: hidden }
.o-way .trk i { display: block; height: 100%; opacity: .35 }
.o-way .trk i.hl { opacity: 1; outline: 1.5px solid #fff; outline-offset: -1.5px }
.o-way .map svg { position: absolute; inset: 0; overflow: visible } .o-way .map line { stroke: #39FF14 }
.o-way[aria-pressed="true"] .trk i.hl { outline-color: #0E0F13 } .o-way[aria-pressed="true"] .map line { stroke: #0E0F13 }
.o-way .wc { font-size: 11px; color: #B8B8C2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-way[aria-pressed="true"] .wc { color: #3A3B46 }
.o-way .bdg { position: absolute; top: 4px; right: 5px; width: 16px; height: 16px; border-radius: 999px; background: #39FF14; color: #0E0F13; font: 700 10px/16px var(--mono); text-align: center }
.o-way .rt { position: absolute; top: 5px; left: 6px; width: 8px; height: 8px; border-radius: 50% }
.o-line { flex: none; display: flex; align-items: center; gap: 8px; min-height: 22px; font-size: 11.5px; color: #B8B8C2 }
.o-line .s { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.o-line .s b { color: #F4F4F8; font-weight: 600 }
.o-more { flex: none; background: none; border: none; color: #D3D1DC; font-size: 12px; padding: 4px 0 4px 6px; min-height: 30px; white-space: nowrap }
.o-try { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px }
.o-try::-webkit-scrollbar { display: none }
.o-try button { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3B46; background: #1A1B21; color: #F4F4F8; font-size: 12.5px; font-weight: 500; white-space: nowrap }
.o-try button.sent { border-style: dashed; color: #8fe3ff; border-color: #2c4a52 }
.o-try button.on { background: #F4F4F8; color: #0E0F13; border-color: #F4F4F8; font-weight: 600 }
.o-try button { position: relative }
.o-try .rd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px }
.o-try .nb { position: absolute; top: -5px; right: -4px; width: 16px; height: 16px; border-radius: 999px; background: #39FF14; color: #0E0F13; font: 700 10px/16px var(--mono); text-align: center }
.o-try .lb { flex: none; align-self: center; font-size: 11.5px; color: #B8B8C2; white-space: nowrap }
.o-tr { flex: none; display: flex; align-items: flex-start; justify-content: center; gap: 20px }
.o-tr .c { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; font-size: 11px; color: #B8B8C2; width: 58px; text-align: center }
.o-tr .c button { width: 44px; height: 44px; border-radius: 999px; border: none; background: #24252D; color: #F4F4F8; display: grid; place-items: center }
.o-tr .c button.on { background: #3A3B46; color: #5DCAA5; box-shadow: inset 0 0 0 1.5px #5DCAA5 }
.o-play { width: 64px; height: 64px; border-radius: 999px; border: none; background: #F4F4F8; display: grid; place-items: center }
.o-prompt { flex: none; min-height: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12.5px; color: #B8B8C2; white-space: nowrap; overflow: hidden }
.o-prompt button { background: none; border: none; color: #8fe3ff; font-size: 12.5px; padding: 2px 0; text-decoration: underline; min-height: 24px }
.o-rates { flex: none; display: flex; gap: 6px }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";

const SB_KEY = "sb_publishable_ssrd2j825Mi3CJVEMxBvwA_eq4OHvkY";   // the same public key as index.html
const BUCKET = "tc-previews";

  ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }) : null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const RATE = [
  { n: 1, l: "Crash", c: "#ff6b5e", r: 40, m: "doesn't work at all" },
  { n: 2, l: "Go-around", c: "#ffb547", r: -20, m: "abort, try another approach" },

];
const plane = (rot, col, w = 24) => `<svg aria-hidden="true" width="${w}" height="${Math.round(w * .58)}" viewBox="0 0 34 20" style="transform:rotate(${rot}deg)"><path d="M2 10 L13 9 L19 2 L22 2 L18 9 L28 9 Q33 10 28 11 L18 11 L22 18 L19 18 L13 11 L2 10 Z M3 10 L6 6 L8 6 L7 10 L8 14 L6 14 Z" fill="${col}"/></svg>`;

const SKIN = { low: "#ff2a9d", mid: "#9b5cff", high: "#29f0ff", bg: "#160b26" };

let ME = null, ADMIN = false, NAMES = {}, META = { sync: null, feedback: null };

const ui = { pl: lsGet("tcr-pl"), f: lsGet("tcr-f") || "rate", pair: null, opt: null, shown: 60, showDropped: false, playing: null, cmpDone: new Set(), sg: new Set(), sgFor: null, asked: new Set() };

/* ---------- data ---------- */
async function all(q, page = 1000) {
  let out = [], i = 0;
  for (;;) {
    const { data, error } = await q().range(i, i + page - 1);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < page) return out;
    i += page;
  }
}
async function loadMeta() {
  const { data } = await sb.from("tc_meta").select("key,value,updated_at");
  for (const r of data || []) META[r.key] = r.value;
}
async function loadAll() {
  await loadMeta();
  const [songs, pls, opts] = await Promise.all([
    all(() => sb.from("tc_songs").select("*")),
    all(() => sb.from("tc_playlists").select("*").order("sort")),
    all(() => sb.from("tc_options").select("*").order("id")),
  ]);
  SONGS = {}; songs.forEach(s => SONGS[s.id] = s);

  OPTS = {}; opts.forEach(o => OPTS[o.id] = o);
  LAST_OPT = opts.reduce((m, o) => o.updated_at > m ? o.updated_at : m, "");
  await loadRatings();
}
async function loadRatings() {
  RAT = await all(() => sb.from("tc_ratings").select("id,option_id,user_id,kind,rating,winner,symptoms,good,suggest,note,created_at,synced_at,result").order("id"));
}
async function refresh() {
  if (document.hidden) return;
  try {
    await loadMeta();
    if (LAST_OPT) {
      const ch = await all(() => sb.from("tc_options").select("*").gt("updated_at", LAST_OPT).order("updated_at"));
      ch.forEach(o => { OPTS[o.id] = o; if (o.updated_at > LAST_OPT) LAST_OPT = o.updated_at; });
    }
    if (!refresh.n || ++refresh.n % 6 === 0) {        // every few minutes: drop the ones the PC removed
      const ids = new Set((await all(() => sb.from("tc_options").select("id"))).map(x => x.id));
      for (const k of Object.keys(OPTS)) if (!ids.has(k)) delete OPTS[k];
      refresh.n = refresh.n || 1;
    }
    await loadRatings();
    const a = document.activeElement;
    if (a && a.closest && a.closest("#detail") && /^(INPUT|TEXTAREA)$/.test(a.tagName)) { renderSync(); return; }   // don't redraw under your typing
    render();
  } catch (e) { /* offline for a moment: try again next time */ }
}

/* ---------- ratings: yours, pending ones, other people's ---------- */
const mine = () => RAT.filter(r => r.user_id === ME.id);
function myLatest(id, kinds = ["rate", "clear"]) {
  let best = null; for (const r of RAT) if (r.user_id === ME.id && r.option_id === id && kinds.includes(r.kind)) best = r; return best;
}
// the rating that counts for what you see: an admin's own unsynced rating wins until the PC has applied it
function rating(id) {
  const o = OPTS[id]; if (!o) return null;
  if (ADMIN) { const p = myLatest(id); if (p && !p.synced_at) return p.kind === "clear" ? null : p.rating; return o.rating; }
  const m = myLatest(id); return m && m.kind === "rate" ? m.rating : null;
}
const pending = id => { const p = myLatest(id); return !!(p && !p.synced_at); };
const billRating = id => OPTS[id] ? OPTS[id].rating : null;
function othersFor(id) {
  const by = {};
  for (const r of RAT) if (r.option_id === id && r.kind === "rate" && r.user_id !== ME.id && r.rating) by[r.user_id] = r;
  return Object.values(by);
}

/* ---------- pairings (the PC's Research list) ---------- */
const song = id => SONGS[id] || { title: "?", sections: [], bpm: 120 };
const shortT = t => (t.title || "").replace(/ - Purple Disco Machine.*$/i, "").replace(/ \(feat\..*?\)/i, "").replace(/ \(.*?\)$/, "");
const sec = (tid, i) => (song(tid).sections || []).find(s => s.i === i);
const fam = o => o.data.fam || o.id;
const vn = o => o.data.vn || 1;
const fixingNow = o => !!o.data.fixing_now;
const hasStems = o => !!(o.data.stems && o.data.stems.a && o.data.pv && o.data.pv.st);
const hasPv = o => !!o.preview_path || hasStems(o);
const rankKey = o => { const r = rating(o.id); return r == null ? 2.5 : r >= 3 ? r : r - 10; };
function canCompare(o) {
  const v = o.data.variant;
  if (!ADMIN || !v || v.compared || ui.cmpDone.has(o.id) || rating(o.id) != null || !hasPv(o) || fixingNow(o)) return false;
  const old = OPTS[v.parent || v.base]; return !!(old && hasPv(old));
}
function plSet() {
  const k = String(ui.pl || "all"); if (k === "all") return null;
  const p = PLS.find(x => String(x.id) === k); return p ? new Set(p.tracks) : null;
}
function pairings() {
  const by = {};
  for (const o of Object.values(OPTS)) { const k = o.pair_code; (by[k] = by[k] || { key: o.pair_code, a: o.a, b: o.b, opts: [] }).opts.push(o); }
  const out = Object.values(by);
  for (const p of out) {
    const fr = {}, fe = {};
    for (const o of p.opts) { const f = fam(o); fr[f] = Math.max(fr[f] ?? -99, rankKey(o)); fe[f] = Math.max(fe[f] ?? -99, o.score); }
    p.opts.sort((x, y) => { const a = fam(x), b = fam(y); return fr[b] - fr[a] || fe[b] - fe[a] || (a < b ? -1 : a > b ? 1 : 0) || vn(x) - vn(y); });
    p.best = Math.max(...p.opts.map(o => o.score)); p.raw = Math.max(...p.opts.map(o => o.data.raw || o.score));
    const br = ADMIN ? rating : billRating;
    p.n5 = p.opts.filter(o => br(o.id) === 5).length; p.n4 = p.opts.filter(o => br(o.id) === 4).length;
    p.todo = p.opts.filter(o => rating(o.id) == null && (ADMIN ? !fixingNow(o) : hasPv(o))).length;
    p.mine = p.opts.filter(o => rating(o.id) != null).length;
    p.ready = ADMIN ? p.opts.filter(o => o.status === "ready" && !pending(o.id)).length : 0;
    p.fixing = p.opts.filter(o => o.status === "fixing").length;
    p.reprop = p.opts.filter(o => o.data.variant && rating(o.id) == null && hasPv(o) && !fixingNow(o)).length;
    p.cmp = p.opts.filter(canCompare).length;
    p.heard = p.opts.filter(hasPv).length;
  }
  return out.sort((x, y) => y.raw - x.raw || (x.key < y.key ? -1 : 1));
}
const codeQuery = q => { const m = q.trim().toUpperCase().match(/^([A-Z?]{2})2([A-Z?]{2})(?:-(\d+)(?:V(\d+))?)?$/); return m ? { pair: m[1] + "2" + m[2], opt: m[3] ? +m[3] : null, v: m[4] ? +m[4] : null } : null; };
const FILTERS = () => ADMIN
  ? [["rate", "To rate", p => p.todo > 0 || p.ready > 0], ["refine", "Review", p => p.n4 > 0], ["arrange", "In Arrange", p => p.n5 > 0], ["fixing", "Being fixed", p => p.fixing > 0], ["all", "All", () => true]]
  : [["rate", "To rate", p => p.todo > 0], ["mine", "Rated by you", p => p.mine > 0], ["arrange", "In Arrange", p => p.n5 > 0], ["all", "All", () => true]];
function pairShown(p, ps, q) {
  if (ps && !(ps.has(p.a) && ps.has(p.b))) return false;
  const cq = codeQuery(q);
  if (cq) return p.key === cq.pair;
  if (q && !song(p.a).title.toLowerCase().includes(q) && !song(p.b).title.toLowerCase().includes(q)) return false;
  const f = FILTERS().find(x => x[0] === ui.f) || FILTERS()[0];
  return f[2](p);
}

/* ---------- render ---------- */
function renderSync() {
  const s = META.sync, el = $("syncLine");
  if (!s || !s.at) { el.className = "syncl old"; el.innerHTML = `<i></i>The PC hasn't synced yet. Ratings wait until it does.`; return; }
  const ago = Date.now() / 1000 - s.at, old = ago > 600;
  const when = ago < 90 ? "just now" : ago < 3600 ? `${Math.round(ago / 60)} min ago` : ago < 86400 ? `${Math.round(ago / 3600)} h ago` : new Date(s.at * 1000).toLocaleDateString();
  const n = mine().filter(r => !r.synced_at && r.kind !== "request").length;
  el.className = "syncl" + (old ? " old" : "");
  el.innerHTML = `<i></i>PC synced ${when}${old ? ": it applies ratings when the helper is running and no deck is playing" : ""}${n ? ` · ${n} of yours waiting` : ""}`;

let pairsCache = null;
function render() {
  if (!ME) return;
  if (ui.view === "one") return renderOne();
  renderSync();
  const main = $("main");
  if (main.dataset.built === "one") main.dataset.built = "";
  if (!main.dataset.built) {
    main.dataset.built = "1";
    main.innerHTML = `<div class="cols" id="cols">
      <div class="pairs" id="pairsCol">
        <div class="controls controls-pairs">
          <select id="plSel" aria-label="Playlist"></select>
          <input type="search" id="search" placeholder="Search a song or an ID like GL2LY" aria-label="Search" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="seg" id="fSeg" role="group" aria-label="Show"></div>
        </div>
        <div id="pairList" style="display:grid;gap:6px"></div>
      </div>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>`;
    $("plSel").onchange = e => { ui.pl = e.target.value; lsSet("tcr-pl", ui.pl); ui.shown = 60; render(); };
    $("search").oninput = () => { ui.shown = 60; render(); };
  }
  const ps = plSet(), q = $("search").value.trim().toLowerCase();

  const sel = $("plSel"), plk = String(ui.pl || "all");
  const plHtml = `<option value="all">All playlists</option>` + PLS.map(p => `<option value="${p.id}">${esc(p.name)} · ${p.tracks.length} analyzed</option>`).join("");
  if (sel.dataset.h !== plHtml) { sel.innerHTML = plHtml; sel.dataset.h = plHtml; }
  sel.value = PLS.some(p => String(p.id) === plk) ? plk : "all";
  const allP = pairings(); pairsCache = allP;
  const inPl = p => !ps || (ps.has(p.a) && ps.has(p.b));

  $("fSeg").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.f = b.dataset.f; lsSet("tcr-f", ui.f); ui.shown = 60; render(); });
  const shown = allP.filter(p => pairShown(p, ps, q));
  $("pairList").innerHTML = shown.slice(0, ui.shown).map(p => {
    const bd = p.ready ? ["LISTEN AGAIN", "#d25cff"] : p.cmp ? ["COMPARE", "#6fd3ff"] : p.reprop ? ["RE-PROPOSAL", "#6fd3ff"] : p.todo === p.opts.length ? ["NEW", "#f0c72e"] : p.todo ? null : p.fixing ? ["FIXING", "#ffb547"] : ["DONE", "#3fe0c5"];
    const sub = `${p.opts.length} way${p.opts.length > 1 ? "s" : ""} · best ${Math.round(p.best)}${p.n5 ? ` · ${p.n5} in Arrange` : ""}${p.n4 ? ` · ${p.n4} in Review` : ""}${!ADMIN && p.mine ? ` · you rated ${p.mine}` : ""}`;
    return `<button type="button" class="pair" aria-pressed="${ui.pair === p.key}" data-pair="${esc(p.key)}"><b>${esc(shortT(song(p.a)))} → ${esc(shortT(song(p.b)))}</b>${bd ? `<span class="bd" style="background:${bd[1]}">${bd[0]}</span>` : "<span></span>"}<span class="sub">${sub}</span><span class="pcode">${esc(p.key)}</span></button>`;
  }).join("") + (shown.length > ui.shown ? `<button type="button" class="btn more" id="moreBtn">Show more (${shown.length - ui.shown} left)</button>` : "")
    || `<div class="empty">${Object.keys(OPTS).length ? "No pairings here. Try another filter or playlist." : "Nothing synced from the PC yet."}</div>`;
  $("pairList").querySelectorAll("[data-pair]").forEach(b => b.onclick = () => openPair(b.dataset.pair, true));
  if ($("moreBtn")) $("moreBtn").onclick = () => { ui.shown += 60; render(); };
  const cq = codeQuery(q);
  if (cq && shown.length === 1 && ui.pair !== shown[0].key && matchMedia("(min-width: 900px)").matches) ui.pair = shown[0].key;
  renderDetail(allP.find(p => p.key === ui.pair) || null, cq);
}
function openPair(key, push) {
  ui.pair = key; ui.opt = null; ui.showDropped = false;
  if (push) { try { history.pushState({ pair: key }, "", "#" + key); } catch (e) {} }
  render();

}

window.addEventListener("popstate", () => { if (ui.view === "one") return; const k = location.hash.slice(1).toUpperCase(); if (k && pairsCache && pairsCache.some(p => p.key === k)) openPair(k, false); else closePair(); });

function optOutcome(o, p) {
  const r = billRating(o.id), mr = rating(o.id);
  if (ADMIN && pending(o.id)) return [mr == null ? "Clearing: waiting for the PC" : `Rated ${mr}: waiting for the PC`, "#12303a", "#8fe3ff"];
  if (o.status === "arrange") return [`In Arrange · option ${p.opts.filter(x => billRating(x.id) === 5).indexOf(o) + 1}`, "#10302b", "#8ff0df"];
  const map = { review: ["#2b2712", "#f6dc77"], looking: ["#2b2712", "#f6dc77"], dropped: ["#2e1513", "#ffb0a8"], ready: ["#3a1f40", "#eab6ff"], fixing: ["#2b2112", "#ffcf86"], making: ["#2b2112", "#ffcf86"] };
  const c = map[o.status];
  if (!ADMIN && o.status === "todo") return [r == null ? "Bill hasn't rated it" : "", "", ""];
  return [o.data.out || "Not rated yet", c ? c[0] : "", c ? c[1] : ""];
}
function rateButtons(id, cur, attr, off) {
  const pend = pending(id);
  return `<div class="rate${off ? " off" : ""}" role="group" aria-label="Rate the landing"${off ? ' aria-hidden="true"' : ""}>${RATE.map(x => `<button type="button" ${attr}="${x.n}" data-id="${esc(id)}" aria-pressed="${cur === x.n}" class="${cur === x.n && pend ? "pend" : ""}" style="--rc:${x.c}" aria-label="${x.n} ${x.l}: ${x.m}"><span>${x.n}</span>${plane(x.r, x.c)}${x.l.toUpperCase()}</button>`).join("")}</div>`;
}
function pvBtn(o) {
  const playing = ui.playing === o.id;
  if (hasPv(o)) return `<button type="button" class="pv${playing ? " playing" : ""}" data-pv="${esc(o.id)}" aria-label="${playing ? "Stop" : "Play"} the preview">${playing ? '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>Stop' : '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>Play'}</button>`;
  const asked = ui.asked.has(o.id) || mine().some(r => r.option_id === o.id && r.kind === "request" && Date.now() - new Date(r.created_at).getTime() < 3600e3);

}
function crashHtml(rep) {

  return `<div class="crash"><div><b>Why TCM suggested it:</b> scored ${esc(rep.score)}${rep.strong && rep.strong.length ? `, strongest on ${rep.strong.map(x => `${esc(x.words)} ${(+x.score).toFixed(2)}`).join(", ")}` : ""}. ${esc(rep.why || "")}</div>
    <div><b>What you heard:</b> ${esc((rep.heard || []).join(", ") || "not said")}. <b>Where it went wrong:</b> ${esc(cause)}.</div>${(rep.lessons || []).map(l => `<div>· ${esc(l)}</div>`).join("")}</div>`;
}
// the PC writes "you" meaning Bill: say whose it is when someone else is looking
const who = s => ADMIN ? String(s || "").replace(/from Bill's ratings/g, "from your ratings")

/* ---------- sending: a row in tc_ratings, which the PC picks up ---------- */
async function send(row) {

/* ---------- previews: signed links (an hour), one player ---------- */
const URLS = {};
async function signAhead(opts) {
  const need = opts.filter(o => o.preview_path && !(URLS[o.preview_path] && URLS[o.preview_path].exp > Date.now())).map(o => o.preview_path);
  if (!need.length) return;
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
  for (const d of data || []) if (d.signedUrl) URLS[d.path] = { url: d.signedUrl, exp: Date.now() + 3300e3 };
}

  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error || !data) return null;
  URLS[path] = { url: data.signedUrl, exp: Date.now() + 3300e3 }; return data.signedUrl;
}

  if (!o.preview_path) return;
  if (!keepQueue && ui.playing !== id) ui.queue = [];
  if (ui.playing === id) { stop(); return; }
  ui.opt = id; ui.playing = id;
  const cached = URLS[o.preview_path] && URLS[o.preview_path].exp > Date.now() ? URLS[o.preview_path].url : null;
  const url = cached || await urlFor(o.preview_path);
  if (!url || ui.playing !== id) { if (!url) toast("Couldn't get the preview. Try again in a moment."); return; }
  audio.src = url; audio.dataset.id = "";
  audio.play().catch(() => toast("Tap Play again to start the preview"));
  $("pName").textContent = `${o.opt_code} · ${o.data.variant ? o.data.variant.what : who(o.data.name)}`;
  $("player").hidden = false; document.body.classList.add("playing");
  render(); tick();
}

audio.addEventListener("ended", () => { if (ui.view === "one") return oEnded(); const nx = (ui.queue || []).shift(); if (nx) { ui.playing = null; play(nx, true); } else stop(); });
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
function tick() {

  const d = audio.duration || (OPTS[ui.playing] && OPTS[ui.playing].data.pv && OPTS[ui.playing].data.pv.secs) || 30, t = audio.currentTime || 0;
  $("pBar").style.width = Math.min(100, t / d * 100) + "%"; $("pTime").textContent = `${fmt(t)} / ${fmt(d)}`;

  if (ph) { if (ui.playing === ui.opt && o && o.data.pv) { ph.style.display = "block"; ph.style.left = `calc(${Math.min(100, t / (o.data.pv.secs || d) * 100)}% - 1px)`; } else ph.style.display = "none"; }

}
function setSheet() {
  const s = META.sync, ago = s && s.at ? Date.now() / 1000 - s.at : null;
  const when = ago == null ? "hasn't synced yet" : ago < 90 ? "synced just now" : ago < 3600 ? `synced ${Math.round(ago / 60)} min ago` : ago < 86400 ? `synced ${Math.round(ago / 3600)} h ago` : "synced " + new Date(s.at * 1000).toLocaleDateString();
  const waiting = mine().filter(r => !r.synced_at && r.kind !== "request").length;
  ui.sheetReturn = $("oGear");
  sheet(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h" id="shTitle">Settings</h2><button type="button" class="btn" data-close>Done</button></div>
    <div class="o-set"><label class="t" for="sThr">Transition threshold: <span id="sThrV" style="color:#5DCAA5">${SET.thr}</span></label>
      <div class="d">Only pairs scoring this or higher count toward a playlist.</div>
      <input type="range" id="sThr" min="40" max="95" step="1" value="${SET.thr}">
      <div style="display:flex;justify-content:space-between;font:12px var(--mono);color:#8A8A96"><span>40</span><span>95</span></div></div>
    <div class="o-set" style="grid-template-columns:1fr auto;align-items:center"><div><div class="t">Ways to compare</div><div class="d">Plays by itself the first time you hear a pair.</div></div>
      <div class="o-step"><button type="button" id="sDec" aria-label="Fewer">−</button><b id="sN">${SET.n}</b><button type="button" id="sInc" aria-label="More">+</button></div></div>
    <div class="o-set"><div class="t">Waveform style</div>
      <div class="o-skins">${Object.entries(SKINS).map(([k, S]) => `<button type="button" class="o-skin" data-skin="${k}" aria-pressed="${SET.skin === k}" aria-label="${S.label}" style="--sp:${S.p}">${S.c.map(c => `<i style="background:${c}"></i>`).join("")}${S.name}</button>`).join("")}</div></div>
    <div class="o-set"><div class="t">Curve colours</div><div class="d">Volume, bass (EQ) and filter lines over the waveform.</div>
      <div class="o-skins">${Object.entries(PALS).map(([k, P]) => `<button type="button" class="o-skin" data-pal="${k}" aria-pressed="${SET.pal === k}" style="--sp:${P.v};font-family:var(--body);letter-spacing:0;font-weight:600">${[P.v, P.e, P.f].map(c => `<i style="background:${c};height:16px;width:6px"></i>`).join("")}${P.name}</button>`).join("")}</div></div>
    <div class="o-set"><div class="t">Every pairing</div><div class="d">The full list: compare cards, ideas for the next try, and going back to ones you've rated.</div>
      <button type="button" class="btn" id="sList" style="justify-self:start">Open the list</button></div>
    <div class="o-set"><div class="d">Your PC ${when}${waiting ? ` · ${waiting} of your ratings waiting` : ""}. It applies ratings when the helper is running and no deck is playing.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${ADMIN ? `<button type="button" class="btn" id="sPeople">People</button>` : ""}<a class="btn" href="./" style="display:inline-grid;place-items:center;text-decoration:none;color:var(--ink)">← Festival Radar</a></div></div>`);
  const root = $("sheetRoot");
  $("sThr").oninput = e => { SET.thr = +e.target.value; $("sThrV").textContent = SET.thr; lsSet("tcr-thr", SET.thr); };
  $("sThr").onchange = () => { PL.stop(); PL.paused = true; ui.cp = null; ui.cmp = null; ui.bi = 0; renderOne(); };
  const step = d => { SET.n = Math.max(2, Math.min(5, SET.n + d)); $("sN").textContent = SET.n; lsSet("tcr-n", SET.n); ui.bi = 0; renderOne(); };
  $("sDec").onclick = () => step(-1); $("sInc").onclick = () => step(1);
  root.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => { SET.skin = b.dataset.skin; lsSet("tcr-skin", SET.skin); root.querySelectorAll("[data-skin]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); oDraw(true); });
  root.querySelectorAll("[data-pal]").forEach(b => b.onclick = () => { SET.pal = b.dataset.pal; lsSet("tcr-pal", SET.pal); root.querySelectorAll("[data-pal]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderOne(); });
  $("sList").onclick = () => { closeSheet(); setView("list"); };
  if ($("sPeople")) $("sPeople").onclick = () => { closeSheet(); ui.sheetReturn = $("oGear"); people(); };
}
function setView(v) {
  ui.view = v; lsSet("tcr-view", v); PL.stop(); PL.paused = true;
  document.body.classList.toggle("one", v === "one");
  $("main").dataset.built = ""; render();
  window.scrollTo({ top: 0 });
}
$("oneBtn").onclick = () => { stop(); setView("one"); };
window.addEventListener("resize", () => { if (ui.view === "one") oDraw(true); });

/* ---------- people (admin): who can open Research ---------- */
async function people() {
  const { data, error } = await sb.rpc("tc_members");
  if (error) return toast("Couldn't load the members");
  const list = data || [];
  sheet(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h" id="shTitle">Who can open Research</h2><button type="button" class="btn" data-close>Close</button></div>
    <div class="small muted">People you turn on here can listen and rate on this page. Their ratings show next to yours by name; only yours change your scores, Review and Arrange.</div>
    <div>${list.map(m => `<div class="person"><span>${esc(m.name)}${m.admin ? ' <span class="small muted">· admin</span>' : ""}</span>${m.admin ? `<span class="small muted">Always</span>` : `<button type="button" class="switch" aria-pressed="${!!m.access}" data-uid="${esc(m.id)}">${m.access ? "On" : "Off"}</button>`}</div>`).join("") || `<div class="empty">No members yet.</div>`}</div>`);
  $("sheetRoot").querySelectorAll("[data-uid]").forEach(b => b.onclick = async () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.disabled = true;
    const { error } = await sb.rpc("tc_set_access", { p_user: b.dataset.uid, p_on: on });
    b.disabled = false;
    if (error) return toast("Couldn't change it: " + error.message);
    b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "On" : "Off";
    NAMES = (await sb.rpc("tc_names")).data || NAMES;
  });
}
$("peopleBtn").onclick = () => { ui.sheetReturn = $("peopleBtn"); people(); };

/* ---------- start ---------- */
function gate(html) { $("main").innerHTML = `<div class="gate">${html}</div>`; $("syncLine").textContent = ""; }
async function boot() {
  if (!sb) return gate(`<div class="h">Couldn't load</div><p class="muted">The sign-in library didn't load. Check your connection and reload.</p>`);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return gate(`<div class="h">Sign in first</div><p class="muted">Tower Control Research uses your Festival Radar account.</p><a class="btn primary" style="display:inline-grid;place-items:center;text-decoration:none" href="./">Sign in on Festival Radar</a><p class="small muted">Then come back to this page.</p>`);
  ME = session.user;
  const { data: ok, error } = await sb.rpc("tc_allowed");
  if (error || ok !== true) return gate(`<div class="h">Not on the list yet</div><p class="muted">Tower Control Research is invite only. Ask Bill to turn you on under People.</p><a href="./">Back to Festival Radar</a>`);
  ADMIN = (await sb.rpc("is_admin")).data === true;
  $("peopleBtn").hidden = !ADMIN;
  try { NAMES = (await sb.rpc("tc_names")).data || {}; } catch (e) {}
  try { await loadAll(); }
  catch (e) { return gate(`<div class="h">Couldn't load</div><p class="muted">${esc(e.message || e)}</p><button type="button" class="btn" onclick="location.reload()">Try again</button>`); }
  if (ui.pl == null) ui.pl = ADMIN && META.sync && META.sync.research_playlist ? String(META.sync.research_playlist) : "all";
  const h = location.hash.slice(1).toUpperCase();
  render();
  if (h && pairsCache.some(p => p.key === h)) { ui.pair = h; ui.cp = h; render(); }
  for (const r of mine()) if (!r.synced_at && Date.now() - new Date(r.created_at).getTime() < 3600e3) watch(r.id);
  setInterval(refresh, 30000);
  setInterval(renderSync, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
boot();
})();
</script>
</body>
</html>
